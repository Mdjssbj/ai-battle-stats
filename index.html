<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI COMPARE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#071226;
color:white;
padding:25px;
}

.wrap{
max-width:1450px;
margin:auto;
background:#0b1733;
padding:30px;
border-radius:24px;
position:relative;
}

h1{
font-size:62px;
font-weight:900;
background:linear-gradient(90deg,#18f7a0,#39a6ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

.sub{
font-size:22px;
color:#9db8ff;
margin-bottom:28px;
}

.tgBtn{
position:absolute;
top:30px;
right:30px;
padding:18px 34px;
border-radius:18px;
background:linear-gradient(90deg,#4d8dff,#3a73ff);
color:white;
text-decoration:none;
font-size:28px;
font-weight:700;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
margin-bottom:25px;
}

input,select{
width:100%;
padding:18px;
font-size:20px;
border:none;
outline:none;
border-radius:16px;
background:#1e2d55;
color:#fff;
}

button{
padding:18px;
font-size:21px;
font-weight:700;
border:none;
border-radius:16px;
cursor:pointer;
transition:.2s;
}

.main{
background:linear-gradient(90deg,#2f72ff,#8d2bff);
color:#fff;
}

.gray{
background:#31446d;
color:#fff;
}

button:hover{
transform:scale(1.02);
}

.tableWrap{
overflow:auto;
}

table{
width:100%;
min-width:1250px;
border-collapse:collapse;
}

th,td{
padding:14px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.08);
font-size:18px;
}

th{
color:#8ab8ff;
}

.ok{
color:#19f7a0;
font-weight:700;
}

.bad{
color:#ff5d70;
font-weight:700;
}

.skip{
color:#9aa9d9;
font-weight:700;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
margin-top:28px;
}

.card{
background:#051129;
padding:28px;
border-radius:22px;
text-align:center;
}

.big{
font-size:52px;
font-weight:900;
margin-bottom:8px;
}

.count{
font-size:20px;
color:#9bb6ec;
margin-top:8px;
}

.green{color:#19f7a0;}
.blue{color:#44a4ff;}
.yellow{color:#ffd44d;}
.purple{color:#c971ff;}

.small{
font-size:24px;
}

.del{
background:#ff4f63;
padding:8px 12px;
border-radius:10px;
font-size:14px;
}

.footer{
margin-top:18px;
text-align:center;
color:#8da4d7;
font-size:17px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>AI COMPARE</h1>

<a href="https://t.me/+JxZLoij59XBmNTBi" target="_blank" class="tgBtn">Telegram</a>

<div class="sub">Порівняння точності Gemini / Claude / GPT-5</div>

<div class="grid">

<input id="date" type="date">
<input id="question" placeholder="Валютна пара">

<select id="gemini">
<option value="">Gemini</option>
<option>ВГОРУ</option>
<option>ВНИЗ</option>
<option>ПРОПУСТИТИ</option>
</select>

<select id="claude">
<option value="">Claude</option>
<option>ВГОРУ</option>
<option>ВНИЗ</option>
<option>ПРОПУСТИТИ</option>
</select>

<select id="gpt">
<option value="">GPT-5</option>
<option>ВГОРУ</option>
<option>ВНИЗ</option>
<option>ПРОПУСТИТИ</option>
</select>

<select id="real">
<option value="">Факт</option>
<option>ВГОРУ</option>
<option>ВНИЗ</option>
</select>

<button class="main" onclick="addRow()">Додати</button>
<button class="gray" onclick="resetAll()">Очистити</button>

</div>

<div class="tableWrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Дата</th>
<th>Пара</th>
<th>Gemini</th>
<th>Claude</th>
<th>GPT-5</th>
<th>Факт</th>
<th>X</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="stats">

<div class="card">
<div class="big green" id="gemStat">0%</div>
<div class="small">Gemini</div>
<div class="count" id="gemCount">0 угод</div>
</div>

<div class="card">
<div class="big blue" id="claudeStat">0%</div>
<div class="small">Claude</div>
<div class="count" id="claudeCount">0 угод</div>
</div>

<div class="card">
<div class="big yellow" id="gptStat">0%</div>
<div class="small">GPT-5</div>
<div class="count" id="gptCount">0 угод</div>
</div>

<div class="card">
<div class="big purple" id="winner">---</div>
<div class="small">Найточніший AI</div>
<div class="count" id="totalCount">0 записів</div>
</div>

</div>

<div class="footer">
Автозбереження у браузері
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("aiCompareV4") || "[]");

function addRow(){

let item={
date:date.value,
question:question.value,
gemini:gemini.value,
claude:claude.value,
gpt:gpt.value,
real:real.value
};

if(!item.date||!item.question||!item.gemini||!item.claude||!item.gpt||!item.real)return;

data.push(item);

save();
render();

question.value="";
gemini.value="";
claude.value="";
gpt.value="";
real.value="";
}

function cls(v,real){
if(v=="ПРОПУСТИТИ") return "skip";
if(v==real) return "ok";
return "bad";
}

function render(){

let html="";

let gWin=0,cWin=0,pWin=0;
let gTotal=0,cTotal=0,pTotal=0;

for(let i=0;i<data.length;i++){

let r=data[i];

if(r.gemini!="ПРОПУСТИТИ"){
gTotal++;
if(r.gemini==r.real) gWin++;
}

if(r.claude!="ПРОПУСТИТИ"){
cTotal++;
if(r.claude==r.real) cWin++;
}

if(r.gpt!="ПРОПУСТИТИ"){
pTotal++;
if(r.gpt==r.real) pWin++;
}

html+=`
<tr>
<td>${i+1}</td>
<td>${r.date}</td>
<td>${r.question}</td>
<td class="${cls(r.gemini,r.real)}">${r.gemini}</td>
<td class="${cls(r.claude,r.real)}">${r.claude}</td>
<td class="${cls(r.gpt,r.real)}">${r.gpt}</td>
<td>${r.real}</td>
<td><button class="del" onclick="delRow(${i})">X</button></td>
</tr>
`;
}

rows.innerHTML=html;

let p1=gTotal?((gWin/gTotal)*100).toFixed(1):0;
let p2=cTotal?((cWin/cTotal)*100).toFixed(1):0;
let p3=pTotal?((pWin/pTotal)*100).toFixed(1):0;

gemStat.innerText=p1+"%";
claudeStat.innerText=p2+"%";
gptStat.innerText=p3+"%";

gemCount.innerText=gTotal+" угод";
claudeCount.innerText=cTotal+" угод";
gptCount.innerText=pTotal+" угод";

totalCount.innerText=data.length+" записів";

let best="Немає";

if(data.length>0){

best="Нічия";

if(p1>p2 && p1>p3) best="Gemini";
else if(p2>p1 && p2>p3) best="Claude";
else if(p3>p1 && p3>p2) best="GPT-5";

}

winner.innerText=best;
}

function delRow(i){
data.splice(i,1);
save();
render();
}

function save(){
localStorage.setItem("aiCompareV4",JSON.stringify(data));
}

function resetAll(){
if(confirm("Очистити всі результати?")){
localStorage.removeItem("aiCompareV4");
location.reload();
}
}

render();

</script>

</body>
</html>
