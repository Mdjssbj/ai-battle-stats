<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Compare Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#071226;
color:white;
padding:30px;
}

.wrap{
max-width:1400px;
margin:auto;
background:#0b1733;
padding:30px;
border-radius:25px;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

h1{
font-size:54px;
font-weight:900;
background:linear-gradient(90deg,#18f7a0,#4ea4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

.sub{
font-size:22px;
color:#9bb7ff;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

input,select{
width:100%;
padding:18px;
border:none;
outline:none;
border-radius:16px;
background:#1e2c52;
color:white;
font-size:20px;
}

button{
padding:18px;
border:none;
border-radius:16px;
font-size:22px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.mainBtn{
background:linear-gradient(90deg,#2f72ff,#8a2bff);
color:white;
}

.mainBtn:hover{
transform:scale(1.02);
}

.secBtn{
background:#32446f;
color:white;
}

.tableWrap{
overflow:auto;
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
min-width:1100px;
}

th,td{
padding:14px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.08);
font-size:18px;
}

th{
color:#7fb3ff;
}

.correct{
color:#18f7a0;
font-weight:700;
}

.wrong{
color:#ff5a6e;
font-weight:700;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#061129;
padding:30px;
border-radius:22px;
text-align:center;
}

.big{
font-size:54px;
font-weight:900;
margin-bottom:10px;
}

.green{color:#18f7a0;}
.blue{color:#37a2ff;}
.yellow{color:#ffd84d;}
.purple{color:#c975ff;}

.small{
font-size:24px;
}

.footer{
margin-top:20px;
text-align:center;
color:#8ea6db;
font-size:18px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>AI COMPARE PRO</h1>
<div class="sub">Порівняння точності Gemini / Claude / GPT-5</div>

<div class="grid">
<input id="date" type="date">
<input id="question" placeholder="Питання / прогноз">
<select id="gemini">
<option value="">Gemini</option>
<option>UP</option>
<option>DOWN</option>
<option>YES</option>
<option>NO</option>
</select>

<select id="claude">
<option value="">Claude</option>
<option>UP</option>
<option>DOWN</option>
<option>YES</option>
<option>NO</option>
</select>

<select id="gpt">
<option value="">GPT-5</option>
<option>UP</option>
<option>DOWN</option>
<option>YES</option>
<option>NO</option>
</select>

<select id="real">
<option value="">Результат</option>
<option>UP</option>
<option>DOWN</option>
<option>YES</option>
<option>NO</option>
</select>

<button class="mainBtn" onclick="addRow()">Додати результат</button>
<button class="secBtn" onclick="resetAll()">Очистити</button>
</div>

<div class="tableWrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Дата</th>
<th>Питання</th>
<th>Gemini</th>
<th>Claude</th>
<th>GPT-5</th>
<th>Факт</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="stats">

<div class="card">
<div class="big green" id="gemStat">0%</div>
<div class="small">Gemini</div>
</div>

<div class="card">
<div class="big blue" id="claudeStat">0%</div>
<div class="small">Claude</div>
</div>

<div class="card">
<div class="big yellow" id="gptStat">0%</div>
<div class="small">GPT-5</div>
</div>

<div class="card">
<div class="big purple" id="winner">---</div>
<div class="small">Найточніший AI</div>
</div>

</div>

<div class="footer">
Зберігається автоматично у браузері
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("aiCompare") || "[]");

function addRow(){

let item = {
date: date.value,
question: question.value,
gemini: gemini.value,
claude: claude.value,
gpt: gpt.value,
real: real.value
};

if(
!item.date ||
!item.question ||
!item.gemini ||
!item.claude ||
!item.gpt ||
!item.real
)return;

data.push(item);

save();
render();

question.value="";
gemini.value="";
claude.value="";
gpt.value="";
real.value="";
}

function render(){

let html="";

let g1=0,g2=0,g3=0;

for(let i=0;i<data.length;i++){

let r=data[i];

let c1=r.gemini==r.real;
let c2=r.claude==r.real;
let c3=r.gpt==r.real;

if(c1) g1++;
if(c2) g2++;
if(c3) g3++;

html+=`
<tr>
<td>${i+1}</td>
<td>${r.date}</td>
<td>${r.question}</td>
<td class="${c1?'correct':'wrong'}">${r.gemini}</td>
<td class="${c2?'correct':'wrong'}">${r.claude}</td>
<td class="${c3?'correct':'wrong'}">${r.gpt}</td>
<td>${r.real}</td>
</tr>
`;
}

rows.innerHTML=html;

let total=data.length || 1;

let p1=(g1/total*100).toFixed(1);
let p2=(g2/total*100).toFixed(1);
let p3=(g3/total*100).toFixed(1);

gemStat.innerText=p1+"%";
claudeStat.innerText=p2+"%";
gptStat.innerText=p3+"%";

let best="GPT-5";

if(p1>p2 && p1>p3) best="Gemini";
else if(p2>p1 && p2>p3) best="Claude";

winner.innerText=best;
}

function save(){
localStorage.setItem("aiCompare",JSON.stringify(data));
}

function resetAll(){
if(confirm("Очистити всі результати?")){
localStorage.removeItem("aiCompare");
location.reload();
}
}

render();

</script>

</body>
</html>
